plugins {
    id 'com.android.application'
}

def appVersionName = rootProject.file("../VERSION").text.trim()
def versionParts = appVersionName.tokenize('.').collect { it as int }
def appVersionCode = (versionParts[0] * 1000000) + (versionParts[1] * 1000) + versionParts[2]

android {
    namespace = 'pl.paweljarczak.cdafreeplayer'
    compileSdk = 36
    buildToolsVersion = "35.0.0"

    defaultConfig {
        applicationId = 'pl.paweljarczak.cdafreeplayer'
        minSdk = 28
        targetSdk = 35
        versionCode = appVersionCode
        versionName = appVersionName
    }

    buildFeatures {
        buildConfig = true
    }

    sourceSets {
        main.assets.srcDir rootProject.file('../assets/web')
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    lint {
        abortOnError = true
        warningsAsErrors = false
        checkReleaseBuilds = true
    }

    tasks.withType(JavaCompile).configureEach {
        options.compilerArgs += ['-Xlint:deprecation', '-Xlint:unchecked']
    }

    signingConfigs {
        release {
            def ks = System.getenv("ANDROID_KEYSTORE_PATH")
            if (ks != null && !ks.isEmpty()) {
                storeFile = file(ks)
                storePassword = System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias = System.getenv("ANDROID_KEY_ALIAS")
                keyPassword = System.getenv("ANDROID_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            if (System.getenv("ANDROID_KEYSTORE_PATH")) {
                signingConfig = signingConfigs.release
            }
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled = false
        }
    }
}

dependencies {
    implementation 'androidx.core:core:1.17.0'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.webkit:webkit:1.17.0'
    implementation 'androidx.media3:media3-exoplayer:1.10.1'
    implementation 'androidx.media3:media3-exoplayer-dash:1.10.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.10.1'
    implementation 'androidx.media3:media3-ui:1.10.1'
    implementation 'org.jsoup:jsoup:1.18.3'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
