name: Build and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cda-free-player-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Validate VERSION and tag
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < VERSION)"
          python - <<'PY'
          import re
          v = open('VERSION', encoding='utf-8').read().strip()
          assert re.fullmatch(r'\d+\.\d+\.\d+', v), v
          print('VERSION', v)
          PY
          if [[ "${GITHUB_REF:-}" == refs/tags/v* ]] && [[ "${GITHUB_REF_NAME}" != "v${VERSION}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match VERSION=${VERSION}" >&2
            exit 1
          fi
      - name: Validate clean repository layout
        shell: bash
        run: |
          set -euo pipefail
          test -s README.md
          EXTRA_MD="$(find . -type f -name '*.md' ! -path './README.md' -print -quit)"
          if [[ -n "$EXTRA_MD" ]]; then
            echo "Unexpected documentation file: $EXTRA_MD" >&2
            exit 1
          fi
          if find . -type d -name '__pycache__' -print -quit | grep -q .; then
            echo "__pycache__ must not be committed" >&2
            exit 1
          fi
      - name: Compile Python
        run: python -m compileall -q cda_free_player desktop_entry.py scripts
      - name: Validate player JavaScript
        run: node --check assets/web/player_capture.js
      - name: Validate XML
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          for p in Path('android-tv/app/src/main/res').rglob('*.xml'):
              ET.parse(p)
          ET.parse('android-tv/app/src/main/AndroidManifest.xml')
          print('Android XML OK')
          PY

  prepare_release:
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - name: Prepare draft GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            draft="$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)"
            if [[ "$draft" != true ]]; then
              echo "Release already published; use a new version tag." >&2
              exit 1
            fi
          else
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --draft \
              --title "CDA Free Player ${GITHUB_REF_NAME}" \
              --generate-notes \
              --verify-tag
          fi

  desktop:
    needs: [validate, prepare_release]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            key: linux-x64
            kind: linux
            arch: x64
          - os: ubuntu-24.04-arm
            key: linux-arm64
            kind: linux
            arch: arm64
          - os: windows-2025
            key: windows-x64
            kind: windows
            arch: x64
          - os: macos-15-intel
            key: macos-x64
            kind: macos
            arch: x64
          - os: macos-15
            key: macos-arm64
            kind: macos
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        if: matrix.kind != 'linux'
        with:
          python-version: '3.13'
          cache: pip

      - name: Install Linux system runtime
        if: matrix.kind == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3 python3-venv python3-pip python3-tk \
            python3-gi python3-gi-cairo \
            gir1.2-gtk-3.0 gir1.2-webkit2-4.1 \
            xvfb xauth mpv

      - name: Verify and package Linux
        if: matrix.kind == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < VERSION)"
          python3 -m venv --system-site-packages .venv-ci
          .venv-ci/bin/python -m pip install --disable-pip-version-check --upgrade pip
          .venv-ci/bin/python -m pip install --disable-pip-version-check -r requirements-linux.txt
          xvfb-run -a .venv-ci/bin/python -m cda_free_player.selftest
          bash packaging/linux.sh "${{ matrix.arch }}"
          ARCHIVE="release_out/CDA-Free-Player-Linux-${{ matrix.arch }}-v${VERSION}.tar.gz"
          test -s "$ARCHIVE"
          LISTING="$(tar -tzf "$ARCHIVE")"
          grep -qxF 'cda-free-player/bootstrap-linux.sh' <<<"$LISTING"
          grep -qxF 'cda-free-player/run.sh' <<<"$LISTING"
          grep -qxF 'cda-free-player/requirements-linux.txt' <<<"$LISTING"
          SIZE="$(stat -c %s "$ARCHIVE")"
          echo "Linux source/runtime package size: $SIZE bytes"
          test "$SIZE" -lt 20000000

      - name: Build Windows
        if: matrix.kind == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content VERSION -Raw).Trim()
          ./packaging/windows.ps1
          $exe = 'dist\CDA Free Player\CDA Free Player.exe'
          if (-not (Test-Path $exe)) { throw "Missing $exe" }
          $check = Start-Process -FilePath (Resolve-Path $exe).Path -ArgumentList '--self-test' -PassThru -Wait
          if ($check.ExitCode -ne 0) {
            Get-Content "$env:LOCALAPPDATA\CDA Free Player\logs\desktop-startup-error.log" -ErrorAction SilentlyContinue
            throw "Windows packaged self-test failed: $($check.ExitCode)"
          }
          New-Item -ItemType Directory -Force release_out | Out-Null
          $zip = "release_out\CDA-Free-Player-Windows-x64-v$version.zip"
          Compress-Archive -Path 'dist\CDA Free Player\*' -DestinationPath $zip -Force
          if (-not (Test-Path $zip) -or (Get-Item $zip).Length -le 0) { throw 'Windows release archive missing or empty' }

      - name: Build macOS
        if: matrix.kind == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < VERSION)"
          bash packaging/macos.sh
          APP="dist/CDA Free Player.app"
          BIN="$APP/Contents/MacOS/CDA Free Player"
          test -x "$BIN"
          "$BIN" --self-test
          mkdir -p release_out
          ZIP="release_out/CDA-Free-Player-macOS-${{ matrix.arch }}-v${VERSION}.zip"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$ZIP"
          test -s "$ZIP"
          unzip -t "$ZIP" >/dev/null

      - name: Upload desktop asset directly to draft Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          success=0
          for attempt in 1 2 3 4 5; do
            if gh release upload "$GITHUB_REF_NAME" release_out/* \
              --repo "$GITHUB_REPOSITORY" --clobber; then
              success=1
              break
            fi
            echo "Release asset upload failed (attempt ${attempt}/5); retrying..." >&2
            sleep $((attempt * 10))
          done
          test "$success" -eq 1

  android:
    needs: [validate, prepare_release]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'
          cache-provider: basic
      - name: Verify Android toolchain
        shell: bash
        run: |
          set -euo pipefail
          test -d "$ANDROID_SDK_ROOT/platforms/android-36"
          test -x "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner"
          gradle --version
      - name: Android compile and lint preflight
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace --warning-mode all -p android-tv \
            :app:checkDebugAarMetadata \
            :app:compileDebugJavaWithJavac \
            :app:testDebugUnitTest \
            :app:lintDebug
      - name: Build debug APK
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace --warning-mode all -p android-tv :app:assembleDebug
          mkdir -p release_out
          VERSION="$(tr -d '[:space:]' < VERSION)"
          cp android-tv/app/build/outputs/apk/debug/app-debug.apk "release_out/CDA-Free-Player-AndroidTV-debug-v${VERSION}.apk"
      - name: Require Android release signing secrets
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KSP: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KSA: ${{ secrets.ANDROID_KEY_ALIAS }}
          KP: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          [[ -n "$KS" && -n "$KSP" && -n "$KSA" && -n "$KP" ]] || {
            echo "Missing Android signing secrets. Release APK must always use the same signing key." >&2
            exit 1
          }
      - name: Decode Android release keystore
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android-tv/release.jks
      - name: Build signed Android release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/android-tv/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < VERSION)"
          gradle --no-daemon --stacktrace --warning-mode all -p android-tv \
            :app:checkReleaseAarMetadata \
            :app:compileReleaseJavaWithJavac \
            :app:assembleRelease \
            :app:bundleRelease \
            :app:lintRelease
          mkdir -p release_out
          cp android-tv/app/build/outputs/apk/release/app-release.apk "release_out/CDA-Free-Player-AndroidTV-v${VERSION}.apk"
          cp android-tv/app/build/outputs/bundle/release/app-release.aab "release_out/CDA-Free-Player-AndroidTV-v${VERSION}.aab"
      - name: Validate Android APK
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < VERSION)"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            APK="release_out/CDA-Free-Player-AndroidTV-v${VERSION}.apk"
            "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          else
            APK="release_out/CDA-Free-Player-AndroidTV-debug-v${VERSION}.apk"
          fi
          test -s "$APK"
          test "$(apkanalyzer manifest application-id "$APK")" = "pl.paweljarczak.cdafreeplayer"
          test "$(apkanalyzer manifest min-sdk "$APK")" = "28"
          test "$(apkanalyzer manifest target-sdk "$APK")" = "35"
          test "$(apkanalyzer manifest version-name "$APK")" = "$VERSION"
          apkanalyzer apk summary "$APK"
      - name: Upload Android release assets directly to draft Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          success=0
          for attempt in 1 2 3 4 5; do
            if gh release upload "$GITHUB_REF_NAME" release_out/* \
              --repo "$GITHUB_REPOSITORY" --clobber; then
              success=1
              break
            fi
            echo "Release asset upload failed (attempt ${attempt}/5); retrying..." >&2
            sleep $((attempt * 10))
          done
          test "$success" -eq 1

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [prepare_release, desktop, android]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Download built assets from draft Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf release-files
          mkdir -p release-files
          success=0
          for attempt in 1 2 3 4 5; do
            rm -rf release-files/*
            if gh release download "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --dir release-files \
              --pattern 'CDA-Free-Player-*'; then
              success=1
              break
            fi
            echo "Release asset download failed (attempt ${attempt}/5); retrying..." >&2
            sleep $((attempt * 10))
          done
          test "$success" -eq 1
      - name: Generate and verify update manifest
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < VERSION)"
          for asset in \
            "CDA-Free-Player-Linux-x64-v${VERSION}.tar.gz" \
            "CDA-Free-Player-Linux-arm64-v${VERSION}.tar.gz" \
            "CDA-Free-Player-Windows-x64-v${VERSION}.zip" \
            "CDA-Free-Player-macOS-x64-v${VERSION}.zip" \
            "CDA-Free-Player-macOS-arm64-v${VERSION}.zip" \
            "CDA-Free-Player-AndroidTV-v${VERSION}.apk" \
            "CDA-Free-Player-AndroidTV-v${VERSION}.aab"; do
            test -s "release-files/$asset" || { echo "Missing/empty release asset: $asset" >&2; exit 1; }
          done
          python scripts/generate_update_manifest.py release-files
          (
            cd release-files
            sha256sum CDA-Free-Player-* > SHA256SUMS.txt
          )
          test -s release-files/update-manifest.json
          test -s release-files/SHA256SUMS.txt
          ls -lah release-files
      - name: Upload metadata and publish Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          success=0
          for attempt in 1 2 3 4 5; do
            if gh release upload "$GITHUB_REF_NAME" \
              release-files/update-manifest.json \
              release-files/SHA256SUMS.txt \
              --repo "$GITHUB_REPOSITORY" --clobber; then
              success=1
              break
            fi
            echo "Metadata upload failed (attempt ${attempt}/5); retrying..." >&2
            sleep $((attempt * 10))
          done
          test "$success" -eq 1
          gh release edit "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false \
            --latest


  cleanup_failed_release:
    if: ${{ always() && startsWith(github.ref, 'refs/tags/v') && needs.release.result != 'success' }}
    needs: [prepare_release, desktop, android, release]
    runs-on: ubuntu-24.04
    steps:
      - name: Remove failed draft Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            draft="$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)"
            if [[ "$draft" == true ]]; then
              gh release delete "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --yes
            fi
          fi
