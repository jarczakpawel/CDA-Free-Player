name: Build and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cda-free-player-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Validate VERSION and tag
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < VERSION)"
          python - <<'PY'
          import re
          v = open('VERSION', encoding='utf-8').read().strip()
          assert re.fullmatch(r'\d+\.\d+\.\d+', v), v
          print('VERSION', v)
          PY
          if [[ "${GITHUB_REF:-}" == refs/tags/v* ]] && [[ "${GITHUB_REF_NAME}" != "v${VERSION}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match VERSION=${VERSION}" >&2
            exit 1
          fi
      - name: Validate clean repository layout
        shell: bash
        run: |
          set -euo pipefail
          test ! -s README.md
          EXTRA_MD="$(find . -type f -name '*.md' ! -path './README.md' -print -quit)"
          if [[ -n "$EXTRA_MD" ]]; then
            echo "Unexpected documentation file: $EXTRA_MD" >&2
            exit 1
          fi
          if find . -type d -name '__pycache__' -print -quit | grep -q .; then
            echo "__pycache__ must not be committed" >&2
            exit 1
          fi
      - name: Compile Python
        run: python -m compileall -q cda_free_player desktop_entry.py scripts
      - name: Validate XML
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          for p in Path('android-tv/app/src/main/res').rglob('*.xml'):
              ET.parse(p)
          ET.parse('android-tv/app/src/main/AndroidManifest.xml')
          print('Android XML OK')
          PY

  prepare_release:
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - name: Prepare draft GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft
          else
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --draft \
              --title "CDA Free Player ${GITHUB_REF_NAME}" \
              --generate-notes \
              --verify-tag
          fi

  desktop:
    needs: [validate, prepare_release]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            key: linux-x64
            kind: linux
            arch: x64
          - os: ubuntu-24.04-arm
            key: linux-arm64
            kind: linux
            arch: arm64
          - os: windows-2025
            key: windows-x64
            kind: windows
            arch: x64
          - os: macos-15-intel
            key: macos-x64
            kind: macos
            arch: x64
          - os: macos-15
            key: macos-arm64
            kind: macos
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip

      - name: Install Linux native dependencies
        if: matrix.kind == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          # PyQt6 wheels ship Qt itself, but intentionally rely on the host for
          # the GL/EGL, X11/XCB and Chromium runtime stack. GitHub's Ubuntu
          # images are leaner than a normal desktop install, so make every
          # native dependency explicit for both x86_64 and arm64 runners.
          sudo apt-get install -y --no-install-recommends \
            libegl1 \
            libgl1 \
            libopengl0 \
            libgbm1 \
            libdrm2 \
            libglx0 \
            libfontconfig1 \
            libfreetype6 \
            libexpat1 \
            libharfbuzz0b \
            libharfbuzz-subset0 \
            liblcms2-2 \
            libopenjp2-7 \
            libpng16-16t64 \
            libdbus-1-3 \
            libnss3 \
            libnspr4 \
            libatspi2.0-0t64 \
            libasound2t64 \
            libpulse0 \
            libopus0 \
            libminizip1t64 \
            libx11-6 \
            libx11-xcb1 \
            libxcomposite1 \
            libxcursor1 \
            libxdamage1 \
            libxext6 \
            libxfixes3 \
            libxi6 \
            libxrandr2 \
            libxrender1 \
            libxtst6 \
            libxkbfile1 \
            libsm6 \
            libice6 \
            libxcb1 \
            libxcb-cursor0 \
            libxcb-glx0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-shm0 \
            libxcb-sync1 \
            libxcb-util1 \
            libxcb-xfixes0 \
            libxcb-xinerama0 \
            libxcb-xkb1 \
            libxkbcommon0 \
            libxkbcommon-x11-0

      - name: Verify Linux native runtime
        if: matrix.kind == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import ctypes
          required = [
              'libEGL.so.1', 'libGL.so.1', 'libOpenGL.so.0', 'libgbm.so.1',
              'libX11.so.6', 'libX11-xcb.so.1', 'libxcb.so.1',
              'libxkbcommon.so.0', 'libxkbcommon-x11.so.0', 'libnss3.so',
              'libnspr4.so', 'libdbus-1.so.3', 'libfontconfig.so.1',
          ]
          missing = []
          for lib in required:
              try:
                  ctypes.CDLL(lib)
              except OSError as exc:
                  missing.append(f'{lib}: {exc}')
          if missing:
              raise SystemExit('Missing Linux runtime libraries:\n' + '\n'.join(missing))
          print('Linux native Qt/WebEngine runtime OK')
          PY

      - name: Build Linux
        if: matrix.kind == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < VERSION)"
          bash packaging/linux.sh
          test -x dist/cda-free-player/cda-free-player
          WEBENGINE="$(find dist/cda-free-player -type f -name QtWebEngineProcess -print -quit)"
          if [[ -z "$WEBENGINE" ]]; then
            echo 'QtWebEngineProcess missing from Linux package' >&2
            exit 1
          fi
          # Audit *before* executing the package. That way a future missing
          # native library is reported for every bundled ELF instead of the
          # self-test dying on the first loader error.
          missing=0
          while IFS= read -r -d '' file; do
            if file -b "$file" | grep -q '^ELF '; then
              unresolved="$(ldd "$file" 2>/dev/null | grep -F 'not found' || true)"
              if [[ -n "$unresolved" ]]; then
                echo "Unresolved dependencies in $file:" >&2
                echo "$unresolved" >&2
                missing=1
              fi
            fi
          done < <(find dist/cda-free-player -type f -print0)
          test "$missing" -eq 0
          QT_QPA_PLATFORM=offscreen \
          QTWEBENGINE_DISABLE_SANDBOX=1 \
            dist/cda-free-player/cda-free-player --self-test
          bash packaging/appimage.sh "${{ matrix.arch }}"
          APPIMAGE="release_out/CDA-Free-Player-Linux-${{ matrix.arch }}-v${VERSION}.AppImage"
          test -x "$APPIMAGE"
          test -s "$APPIMAGE"
          file "$APPIMAGE"

      - name: Build Windows
        if: matrix.kind == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content VERSION -Raw).Trim()
          ./packaging/windows.ps1
          $exe = 'dist\CDA Free Player\CDA Free Player.exe'
          if (-not (Test-Path $exe)) { throw "Missing $exe" }
          & $exe --self-test
          if ($LASTEXITCODE -ne 0) { throw "Windows packaged self-test failed: $LASTEXITCODE" }
          New-Item -ItemType Directory -Force release_out | Out-Null
          $zip = "release_out\CDA-Free-Player-Windows-x64-v$version.zip"
          Compress-Archive -Path 'dist\CDA Free Player\*' -DestinationPath $zip -Force
          if (-not (Test-Path $zip) -or (Get-Item $zip).Length -le 0) { throw 'Windows release archive missing or empty' }

      - name: Build macOS
        if: matrix.kind == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < VERSION)"
          bash packaging/macos.sh
          APP="dist/CDA Free Player.app"
          BIN="$APP/Contents/MacOS/CDA Free Player"
          test -x "$BIN"
          "$BIN" --self-test
          mkdir -p release_out
          ZIP="release_out/CDA-Free-Player-macOS-${{ matrix.arch }}-v${VERSION}.zip"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$ZIP"
          test -s "$ZIP"
          unzip -t "$ZIP" >/dev/null

      - name: Upload desktop asset directly to draft Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          success=0
          for attempt in 1 2 3 4 5; do
            if gh release upload "$GITHUB_REF_NAME" release_out/* \
              --repo "$GITHUB_REPOSITORY" --clobber; then
              success=1
              break
            fi
            echo "Release asset upload failed (attempt ${attempt}/5); retrying..." >&2
            sleep $((attempt * 10))
          done
          test "$success" -eq 1

  android:
    needs: [validate, prepare_release]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'
          cache-provider: basic
      - name: Verify Android toolchain
        shell: bash
        run: |
          set -euo pipefail
          test -d "$ANDROID_SDK_ROOT/platforms/android-36"
          test -x "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner"
          gradle --version
      - name: Android compile and lint preflight
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace --warning-mode all -p android-tv \
            :app:checkDebugAarMetadata \
            :app:compileDebugJavaWithJavac \
            :app:testDebugUnitTest \
            :app:lintDebug
      - name: Build debug APK
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace --warning-mode all -p android-tv :app:assembleDebug
          mkdir -p release_out
          VERSION="$(tr -d '[:space:]' < VERSION)"
          cp android-tv/app/build/outputs/apk/debug/app-debug.apk "release_out/CDA-Free-Player-AndroidTV-debug-v${VERSION}.apk"
      - name: Require Android release signing secrets
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KSP: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KSA: ${{ secrets.ANDROID_KEY_ALIAS }}
          KP: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          [[ -n "$KS" && -n "$KSP" && -n "$KSA" && -n "$KP" ]] || {
            echo "Missing Android signing secrets. Release APK must always use the same signing key." >&2
            exit 1
          }
      - name: Decode Android release keystore
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android-tv/release.jks
      - name: Build signed Android release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/android-tv/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < VERSION)"
          gradle --no-daemon --stacktrace --warning-mode all -p android-tv \
            :app:checkReleaseAarMetadata \
            :app:compileReleaseJavaWithJavac \
            :app:assembleRelease \
            :app:bundleRelease \
            :app:lintRelease
          mkdir -p release_out
          cp android-tv/app/build/outputs/apk/release/app-release.apk "release_out/CDA-Free-Player-AndroidTV-v${VERSION}.apk"
          cp android-tv/app/build/outputs/bundle/release/app-release.aab "release_out/CDA-Free-Player-AndroidTV-v${VERSION}.aab"
      - name: Validate Android APK
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < VERSION)"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            APK="release_out/CDA-Free-Player-AndroidTV-v${VERSION}.apk"
            "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          else
            APK="release_out/CDA-Free-Player-AndroidTV-debug-v${VERSION}.apk"
          fi
          test -s "$APK"
          test "$(apkanalyzer manifest application-id "$APK")" = "pl.paweljarczak.cdafreeplayer"
          test "$(apkanalyzer manifest min-sdk "$APK")" = "28"
          test "$(apkanalyzer manifest target-sdk "$APK")" = "35"
          test "$(apkanalyzer manifest version-name "$APK")" = "$VERSION"
          apkanalyzer apk summary "$APK"
      - name: Upload Android release assets directly to draft Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          success=0
          for attempt in 1 2 3 4 5; do
            if gh release upload "$GITHUB_REF_NAME" release_out/* \
              --repo "$GITHUB_REPOSITORY" --clobber; then
              success=1
              break
            fi
            echo "Release asset upload failed (attempt ${attempt}/5); retrying..." >&2
            sleep $((attempt * 10))
          done
          test "$success" -eq 1

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [prepare_release, desktop, android]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Download built assets from draft Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf release-files
          mkdir -p release-files
          success=0
          for attempt in 1 2 3 4 5; do
            rm -rf release-files/*
            if gh release download "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --dir release-files \
              --pattern 'CDA-Free-Player-*'; then
              success=1
              break
            fi
            echo "Release asset download failed (attempt ${attempt}/5); retrying..." >&2
            sleep $((attempt * 10))
          done
          test "$success" -eq 1
      - name: Generate and verify update manifest
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < VERSION)"
          for asset in \
            "CDA-Free-Player-Linux-x64-v${VERSION}.AppImage" \
            "CDA-Free-Player-Linux-arm64-v${VERSION}.AppImage" \
            "CDA-Free-Player-Windows-x64-v${VERSION}.zip" \
            "CDA-Free-Player-macOS-x64-v${VERSION}.zip" \
            "CDA-Free-Player-macOS-arm64-v${VERSION}.zip" \
            "CDA-Free-Player-AndroidTV-v${VERSION}.apk" \
            "CDA-Free-Player-AndroidTV-v${VERSION}.aab"; do
            test -s "release-files/$asset" || { echo "Missing/empty release asset: $asset" >&2; exit 1; }
          done
          python scripts/generate_update_manifest.py release-files
          (
            cd release-files
            sha256sum CDA-Free-Player-* > SHA256SUMS.txt
          )
          test -s release-files/update-manifest.json
          test -s release-files/SHA256SUMS.txt
          ls -lah release-files
      - name: Upload metadata and publish Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          success=0
          for attempt in 1 2 3 4 5; do
            if gh release upload "$GITHUB_REF_NAME" \
              release-files/update-manifest.json \
              release-files/SHA256SUMS.txt \
              --repo "$GITHUB_REPOSITORY" --clobber; then
              success=1
              break
            fi
            echo "Metadata upload failed (attempt ${attempt}/5); retrying..." >&2
            sleep $((attempt * 10))
          done
          test "$success" -eq 1
          gh release edit "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false \
            --latest


  cleanup_failed_release:
    if: ${{ always() && startsWith(github.ref, 'refs/tags/v') && needs.release.result != 'success' }}
    needs: [prepare_release, desktop, android, release]
    runs-on: ubuntu-24.04
    steps:
      - name: Remove failed draft Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --yes
          fi
